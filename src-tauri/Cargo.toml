[package]
name = "valx-prose-writer"
version = "1.0.4"
description = "minimalist writing app"
authors = ["tchkrv"]
edition = "2021"

[lib]
name = "valx_prose_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves workspace media (images/audio/video) back to the
# renderer with HTTP Range support — replaces the Electron localhost server.
# macos-private-api: the splash window is transparent, which on macOS is only
# reachable through AppKit private API. It must sit on this top-level entry
# rather than a cfg(target_os = "macos") one — tauri-build validates the
# feature list against app.macOSPrivateApi in tauri.conf.json and its
# find_dependency() stops at [dependencies], never reading [target.*]. Inert on
# Windows (it gates macOS-only code paths), so the Windows build is unchanged.
# Note: private API rules the app out of the Mac App Store; direct DMG
# distribution — what scripts/release.sh builds — is unaffected.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OneDrive sync (src/onedrive.rs): blocking reqwest avoids pulling in a tokio
# runtime — the OAuth loopback server is plain std::net on its own thread, and
# every Graph call is one-shot from a tauri::command. sha2/getrandom/base64
# are for PKCE (code_verifier/code_challenge) — hand-rolling that crypto is
# exactly the kind of "simplification" that isn't worth the risk.
# Spellchecking (src/spellcheck.rs). Pure-Rust Hunspell-compatible checker, so
# there is no libhunspell to find or ship on Windows. The en_US dictionary is
# baked into the binary with include_str! (see spellcheck.rs) — the app owns its
# dictionary rather than deferring to whatever the OS webview happens to have.
spellbook = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
