<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="The Convert Format dialog in Valx, converting a whole workspace between markdown, plain text, HTML and Word">
<style>
  
  .ui{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .prose{font-family:'Valuex','Lucida Console',ui-monospace,monospace}
  g,text,rect,image,path{transform-box:fill-box;transform-origin:center}
  @keyframes c0{0%,16%{opacity:0;transform:translateY(5px)}20.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.c0{animation:c0 10s infinite}
  @keyframes cs0k{0%,32%{opacity:0}34.5%,37%{opacity:1}39.5%,100%{opacity:0}}.cs0{opacity:0;animation:cs0k 10s infinite}
  @keyframes c1{0%,17.2%{opacity:0;transform:translateY(5px)}21.7%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.c1{animation:c1 10s infinite}
  @keyframes cs1k{0%,37%{opacity:0}39.5%,42%{opacity:1}44.5%,100%{opacity:0}}.cs1{opacity:0;animation:cs1k 10s infinite}
  @keyframes c2{0%,18.4%{opacity:0;transform:translateY(5px)}22.9%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.c2{animation:c2 10s infinite}
  @keyframes cs2k{0%,42%{opacity:0}44.5%,47%{opacity:1}49.5%,100%{opacity:0}}.cs2{opacity:0;animation:cs2k 10s infinite}
  @keyframes f0{0%,46%{opacity:0;transform:translateY(5px)}50.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.f0{animation:f0 10s infinite}
  @keyframes f1{0%,47.4%{opacity:0;transform:translateY(5px)}51.9%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.f1{animation:f1 10s infinite}
  @keyframes f2{0%,48.8%{opacity:0;transform:translateY(5px)}53.3%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.f2{animation:f2 10s infinite}
  @keyframes f3{0%,50.2%{opacity:0;transform:translateY(5px)}54.7%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.f3{animation:f3 10s infinite}
  @keyframes modal{0%,2%{opacity:0;transform:translateY(10px)}6.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.modal{animation:modal 10s infinite}
  @keyframes rh{0%,44%{opacity:0;transform:translateY(6px)}48.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.rh{animation:rh 10s infinite}
  @keyframes rn{0%,56%{opacity:0;transform:translateY(5px)}60.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.rn{animation:rn 10s infinite}
  @keyframes cap{0%,64%{opacity:0;transform:translateY(6px)}68.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.cap{animation:cap 10s infinite}
</style>
<rect width="1120" height="560" fill="#0b0b0b"/>

<g class="modal">
  <rect x="60" y="24" width="448" height="412" rx="12" fill="#000000" stroke="#262626"/>
  <line x1="60" y1="81" x2="508" y2="81" stroke="#171717"/>
  <text x="84" y="60" class="ui" font-size="16" font-weight="700" fill="#ffffff">Convert Format</text>
  <text x="484" y="60" text-anchor="end" class="ui" font-size="15" fill="#64748b">✕</text>
  <text x="81" y="132" class="ui" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">APPLY TO</text>
  <rect x="81" y="145" width="199" height="38" rx="8" fill="rgba(50,205,50,.07)" stroke="#32cd32"/>
  <text x="180.5" y="169" text-anchor="middle" class="ui" font-size="14" font-weight="500" fill="#ffffff">All notes</text>
  <rect x="288" y="145" width="199" height="38" rx="8" fill="#000000" stroke="#262626"/>
  <text x="387.5" y="169" text-anchor="middle" class="ui" font-size="14" font-weight="500" fill="#94a3b8">This note</text>
  <text x="81" y="209" class="ui" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SAVE AS (EDITABLE)</text>
</g>
  <g class="c0">
      <rect x="81" y="222" width="406" height="62" rx="8" fill="#000000" stroke="#262626"/>
      <g class="cs0">
        <rect x="81" y="222" width="406" height="62" rx="8" fill="rgba(50,205,50,.07)" stroke="#32cd32"/>
      </g>
      <text x="98" y="248" class="ui" font-size="15" fill="#64748b">▤</text>
      <text x="119" y="248" class="ui" font-size="14" font-weight="500" fill="#ffffff">Markdown (.md)</text>
      <text x="119" y="268" class="ui" font-size="12" fill="#94a3b8">Plain text with light syntax. The default.</text>
    </g>
  <g class="c1">
      <rect x="81" y="292" width="406" height="62" rx="8" fill="#000000" stroke="#262626"/>
      <g class="cs1">
        <rect x="81" y="292" width="406" height="62" rx="8" fill="rgba(50,205,50,.07)" stroke="#32cd32"/>
      </g>
      <text x="98" y="318" class="ui" font-size="15" fill="#64748b">▤</text>
      <text x="119" y="318" class="ui" font-size="14" font-weight="500" fill="#ffffff">Plain text (.txt)</text>
      <text x="119" y="338" class="ui" font-size="12" fill="#94a3b8">No formatting at all.</text>
    </g>
  <g class="c2">
      <rect x="81" y="362" width="406" height="62" rx="8" fill="#000000" stroke="#262626"/>
      <g class="cs2">
        <rect x="81" y="362" width="406" height="62" rx="8" fill="rgba(50,205,50,.07)" stroke="#32cd32"/>
      </g>
      <text x="98" y="388" class="ui" font-size="15" fill="#64748b">▤</text>
      <text x="119" y="388" class="ui" font-size="14" font-weight="500" fill="#ffffff">HTML (.html)</text>
      <text x="119" y="408" class="ui" font-size="12" fill="#94a3b8">Keeps rich formatting and tables.</text>
    </g>

<g class="rh">
  <text x="620" y="144" class="ui" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WHAT LANDS ON DISK</text>
</g>
  <g class="f0">
      <rect x="620" y="174" width="400" height="34" rx="8" fill="#000000" stroke="#262626"/>
      <text x="636" y="196" class="mono" font-size="13" fill="#e2e8f0">delta-notes.md</text>
      <text x="1004" y="196" text-anchor="end" class="ui" font-size="11" fill="#32CD32">converted</text>
    </g>
  <g class="f1">
      <rect x="620" y="218" width="400" height="34" rx="8" fill="#000000" stroke="#262626"/>
      <text x="636" y="240" class="mono" font-size="13" fill="#e2e8f0">interview-okonjo.md</text>
      <text x="1004" y="240" text-anchor="end" class="ui" font-size="11" fill="#32CD32">converted</text>
    </g>
  <g class="f2">
      <rect x="620" y="262" width="400" height="34" rx="8" fill="#000000" stroke="#262626"/>
      <text x="636" y="284" class="mono" font-size="13" fill="#e2e8f0">field-notes-3.md</text>
      <text x="1004" y="284" text-anchor="end" class="ui" font-size="11" fill="#32CD32">converted</text>
    </g>
  <g class="f3">
      <rect x="620" y="306" width="400" height="34" rx="8" fill="#000000" stroke="#262626"/>
      <text x="636" y="328" class="mono" font-size="13" fill="#e2e8f0">metal-souls.md</text>
      <text x="1004" y="328" text-anchor="end" class="ui" font-size="11" fill="#32CD32">converted</text>
    </g>
<text x="620" y="380" class="ui rn" font-size="13" fill="#94a3b8">Real files, in the folder you picked. Export to PDF, DOCX or ODT too.</text>
<g class="cap">
  <text x="24" y="516" class="ui" font-size="17" fill="#32cd32">Convert a note, or the whole workspace</text>
  <text x="24" y="540" class="ui" font-size="14" fill="#94a3b8">Between .md, .txt, .html and .docx in a click — and export to PDF, DOCX or ODT. Tables and attachments survive the round trip.</text>
</g>
</svg>
