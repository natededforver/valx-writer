<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the Android build runs edge-to-edge (MainActivity's
         enableEdgeToEdge), so the page owns the strips behind the status and
         navigation bars. Without cover, env(safe-area-inset-*) reports 0 and
         the greeting renders under the clock. The app root pads itself back
         out — see .vx-safe in index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/main.ico" />
    <title>Valx prose writer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
