[package]
name = "valx-prose-writer"
version = "1.2.0"
description = "minimalist writing app"
authors = ["tchkrv"]
edition = "2021"

[lib]
name = "valx_prose_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves workspace media (images/audio/video) back to the
# renderer with HTTP Range support — replaces the Electron localhost server.
# macos-private-api: the splash window is transparent, which on macOS is only
# reachable through AppKit private API. It must sit on this top-level entry
# rather than a cfg(target_os = "macos") one — tauri-build validates the
# feature list against app.macOSPrivateApi in tauri.conf.json and its
# find_dependency() stops at [dependencies], never reading [target.*]. Inert on
# Windows (it gates macOS-only code paths), so the Windows build is unchanged.
# Note: private API rules the app out of the Mac App Store; direct DMG
# distribution — what scripts/release.sh builds — is unaffected.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.23"

# Desktop-only backend. Both of these are dead weight — or worse — on Android:
#
#   onedrive.rs   the OAuth redirect is a loopback TcpListener on 127.0.0.1,
#                 which no mobile browser will ever come back to. Sync on
#                 Android would need the custom-scheme/app-link flow instead,
#                 so the whole module (and reqwest/url/sha2/getrandom with it)
#                 is left out rather than shipped broken.
#   spellcheck.rs the five dictionaries are include_str!'d into the binary —
#                 8 MB of text per ABI in an APK, to duplicate a checker the
#                 phone keyboard already has. Mobile keeps the webview's own
#                 spellcheck instead (RichTextEditor's spellCheck attribute).
#
# The frontend needs no matching #ifdef: lib/spellcheck.ts already degrades to
# "spelled correctly" when the invoke rejects, and the OneDrive UI is gated on
# isTauri && !isAndroid in App.tsx.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
spellbook = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
sha2 = "0.11"
getrandom = "0.4"

# macOS only: one message to the underlying WKWebView to turn off its
# Safari-style link preview (see lib.rs). Already in the tree via tauri/wry, so
# this pins the same version rather than pulling anything new in. Not listed for
# Windows, which has no WKWebView and builds unchanged.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
