<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="The slash menu open in a Valx note, listing Heading 1, Bullet List, Checked List, Table, Blockquote and Divider with their markdown hints">
<style>
  @font-face{font-family:'Valuex';src:url(data:font/ttf;base64,) format('truetype')}
  .ui{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .prose{font-family:'Valuex','Lucida Console',ui-monospace,monospace}
  g,text,rect,image,path{transform-box:fill-box;transform-origin:center}
  @keyframes it0{0%,20%{opacity:0;transform:translateY(5px)}24.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.it0{animation:it0 10s infinite}
  @keyframes sel0k{0%,34%{opacity:0}36.5%,38.2%{opacity:1}40.7%,100%{opacity:0}}.sel0{opacity:0;animation:sel0k 10s infinite}
  @keyframes it1{0%,20.9%{opacity:0;transform:translateY(5px)}25.4%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.it1{animation:it1 10s infinite}
  @keyframes sel1k{0%,38.2%{opacity:0}40.7%,42.4%{opacity:1}44.9%,100%{opacity:0}}.sel1{opacity:0;animation:sel1k 10s infinite}
  @keyframes it2{0%,21.8%{opacity:0;transform:translateY(5px)}26.3%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.it2{animation:it2 10s infinite}
  @keyframes sel2k{0%,42.4%{opacity:0}44.9%,46.6%{opacity:1}49.1%,100%{opacity:0}}.sel2{opacity:0;animation:sel2k 10s infinite}
  @keyframes it3{0%,22.7%{opacity:0;transform:translateY(5px)}27.2%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.it3{animation:it3 10s infinite}
  @keyframes sel3k{0%,46.6%{opacity:0}49.1%,50.8%{opacity:1}53.3%,100%{opacity:0}}.sel3{opacity:0;animation:sel3k 10s infinite}
  @keyframes it4{0%,23.6%{opacity:0;transform:translateY(5px)}28.1%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.it4{animation:it4 10s infinite}
  @keyframes sel4k{0%,50.8%{opacity:0}53.3%,55%{opacity:1}57.5%,100%{opacity:0}}.sel4{opacity:0;animation:sel4k 10s infinite}
  @keyframes t{0%,4%{opacity:0;transform:translateY(6px)}8.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.t{animation:t 10s infinite}
  @keyframes l1{0%,9%{opacity:0;transform:translateY(5px)}13.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.l1{animation:l1 10s infinite}
  @keyframes l2{0%,11%{opacity:0;transform:translateY(5px)}15.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.l2{animation:l2 10s infinite}
  @keyframes cursor{0%,15%{opacity:0;transform:translateY(0px)}19.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.cursor{animation:cursor 10s infinite}
  @keyframes pop{0%,18%{opacity:0;transform:translateY(10px)}22.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.pop{animation:pop 10s infinite}
  @keyframes cap{0%,60%{opacity:0;transform:translateY(6px)}64.5%,93%{opacity:1;transform:none}98%,100%{opacity:0}}.cap{animation:cap 10s infinite}
</style>
<rect width="1120" height="560" fill="#0b0b0b"/>

<rect x="60" y="24" width="1000" height="424" rx="14" fill="#000000" stroke="rgba(255,255,255,.09)"/>
<text x="120" y="100" class="ui t" font-size="30" font-weight="700" fill="#ffffff">Field notes, week 3</text>
<text x="120" y="152" xml:space="preserve" class="prose l1" font-size="18" fill="#ffffff">The channel moved again overnight. Before the measurements,</text>
<text x="120" y="181" xml:space="preserve" class="prose l2" font-size="18" fill="#ffffff">a table of the readings so far:</text>
<g class="cursor">
  <text x="120" y="215" class="prose" font-size="18" fill="#ffffff">/</text>
  <rect x="131" y="199" width="2" height="22" fill="#32cd32"/>
</g>
<g class="pop">
  <rect x="116" y="224" width="270.7" height="218.4" rx="16" fill="#000000" stroke="rgba(255,255,255,.09)"/>
</g>
  <g class="it0">
      <rect class="sel0" x="119.8" y="229.7" width="263.2" height="41.4" rx="12" fill="#171717"/>
      <rect x="131" y="237.2" width="26.3" height="26.3" rx="6" fill="#171717"/>
      <text x="144.2" y="254.7" text-anchor="middle" class="ui" font-size="12" fill="#64748b">H</text>
      <text x="166.8" y="255.2" class="ui" font-size="14" fill="#ffffff">Heading 1</text>
      <text x="371" y="254.7" text-anchor="end" class="mono" font-size="11" fill="#64748b">#</text>
    </g>
  <g class="it1">
      <rect class="sel1" x="119.8" y="271.09999999999997" width="263.2" height="41.4" rx="12" fill="#171717"/>
      <rect x="131" y="278.59999999999997" width="26.3" height="26.3" rx="6" fill="#171717"/>
      <text x="144.2" y="296.09999999999997" text-anchor="middle" class="ui" font-size="12" fill="#64748b">L</text>
      <text x="166.8" y="296.59999999999997" class="ui" font-size="14" fill="#ffffff">Bullet List</text>
      <text x="371" y="296.09999999999997" text-anchor="end" class="mono" font-size="11" fill="#64748b">-</text>
    </g>
  <g class="it2">
      <rect class="sel2" x="119.8" y="312.5" width="263.2" height="41.4" rx="12" fill="#171717"/>
      <rect x="131" y="320" width="26.3" height="26.3" rx="6" fill="#171717"/>
      <text x="144.2" y="337.5" text-anchor="middle" class="ui" font-size="12" fill="#64748b">C</text>
      <text x="166.8" y="338" class="ui" font-size="14" fill="#ffffff">Checked List</text>
      <text x="371" y="337.5" text-anchor="end" class="mono" font-size="11" fill="#64748b">[ ]</text>
    </g>
  <g class="it3">
      <rect class="sel3" x="119.8" y="353.9" width="263.2" height="41.4" rx="12" fill="#171717"/>
      <rect x="131" y="361.4" width="26.3" height="26.3" rx="6" fill="#171717"/>
      <text x="144.2" y="378.9" text-anchor="middle" class="ui" font-size="12" fill="#64748b">T</text>
      <text x="166.8" y="379.4" class="ui" font-size="14" fill="#ffffff">Table</text>
      <text x="371" y="378.9" text-anchor="end" class="mono" font-size="11" fill="#64748b"></text>
    </g>
  <g class="it4">
      <rect class="sel4" x="119.8" y="395.29999999999995" width="263.2" height="41.4" rx="12" fill="#171717"/>
      <rect x="131" y="402.79999999999995" width="26.3" height="26.3" rx="6" fill="#171717"/>
      <text x="144.2" y="420.29999999999995" text-anchor="middle" class="ui" font-size="12" fill="#64748b">D</text>
      <text x="166.8" y="420.79999999999995" class="ui" font-size="14" fill="#ffffff">Divider</text>
      <text x="371" y="420.29999999999995" text-anchor="end" class="mono" font-size="11" fill="#64748b">---</text>
    </g>
<g class="cap">
  <text x="24" y="516" class="ui" font-size="17" fill="#32cd32">Press / to insert anything</text>
  <text x="24" y="540" class="ui" font-size="14" fill="#94a3b8">Headings, lists, tables, quotes and dividers without your hands leaving the keyboard. Each one shows the markdown it writes.</text>
</g>
</svg>
